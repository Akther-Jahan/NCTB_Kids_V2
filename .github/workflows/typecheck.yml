name: Release checks

on:
  pull_request:
    branches:
      - main
      - release/deployment-ready-v1
  push:
    branches:
      - main
      - release/deployment-ready-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile typecheck, doctor, export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release-env script syntax
        run: node --check scripts/validate-eas-env.mjs

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo Doctor
        run: npm run doctor

      - name: Android JS export
        run: npm run export:android

  admin-web:
    name: Admin CMS build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Admin CMS
        run: npm run build
